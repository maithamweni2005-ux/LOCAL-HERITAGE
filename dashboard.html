<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Local Heritage</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Local Heritage</h2>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-section="home">Home</button>
        <button class="nav-btn" data-section="sites">Sites</button>
        <button class="nav-btn" data-section="artisans">Artisans</button>
        <button class="nav-btn" data-section="reviews">Reviews</button>
        <button class="nav-btn" data-section="profile">Profile</button>
      </nav>
      <button class="btn btn-outline" id="logoutBtn">Logout</button>
    </aside>

    <!-- Main View -->
    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="user-badge" id="userInfo">Loading profile...</div>
      </header>

      <div class="content-area">
        <!-- Home -->
        <section id="home" class="view active">
          <div class="banner">
            <h2 id="welcomeText">Welcome!</h2>
            <p id="welcomeDesc">Loading your personalized dashboard...</p>
          </div>
          <div class="grid cards-grid" id="statsGrid"></div>
        </section>

        <!-- Sites -->
        <section id="sites" class="view">
          <div class="section-head">
            <h2>Tourist Sites</h2>
            <button class="btn btn-primary" id="openAddSiteBtn" style="display:none;">+ Add Site</button>
          </div>
          <div class="grid cards-grid" id="sitesContainer">
            <p class="muted">Loading sites...</p>
          </div>
        </section>

        <!-- Artisans -->
        <section id="artisans" class="view">
          <div class="section-head">
            <h2>Local Artisans</h2>
          </div>
          <div class="grid cards-grid" id="artisansContainer">
            <p class="muted">Loading artisans...</p>
          </div>
        </section>

        <!-- Reviews -->
        <section id="reviews" class="view">
          <div class="section-head">
            <h2>Community Reviews</h2>
          </div>
          <div class="grid cards-grid" id="reviewsContainer">
            <p class="muted">Loading reviews...</p>
          </div>
        </section>

        <!-- Profile -->
        <section id="profile" class="view">
          <div class="card card-form">
            <h2>My Profile</h2>
            <form id="profileForm">
              <div class="form-row">
                <div class="form-group">
                  <label>First Name</label>
                  <input type="text" id="profile-first-name" readonly>
                </div>
                <div class="form-group">
                  <label>Last Name</label>
                  <input type="text" id="profile-last-last" readonly>
                </div>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="profile-email" readonly>
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="profile-phone">
              </div>

              <div id="artisan-fields" style="display:none;">
                <div class="form-group">
                  <label>Business Name</label>
                  <input type="text" id="profile-business-name">
                </div>
                <div class="form-group">
                  <label>Bio</label>
                  <textarea id="profile-bio" rows="3"></textarea>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Craft Category</label>
                    <input type="text" id="profile-craft-category">
                  </div>
                  <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="profile-location">
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="saveProfileBtn">Update Profile</button>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Add Site Modal -->
  <div id="siteModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Tourist Site</h3>
        <button class="modal-close" id="closeSiteModalBtn">&times;</button>
      </div>
      <form id="siteForm">
        <div class="form-group">
          <label>Site Title</label>
          <input type="text" id="site-title" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="site-description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="site-location" required>
        </div>
        <div class="form-group">
          <label>Entry Fee (USD)</label>
          <input type="number" id="site-fee" step="0.01" min="0" placeholder="0.00">
        </div>
        <button type="submit" class="btn btn-primary">Save Site</button>
      </form>
    </div>
  </div>

  <!-- Review Modal (Create / Edit) -->
  <div id="reviewModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="reviewModalTitle">Leave a Review</h3>
        <button class="modal-close" id="closeReviewModalBtn">&times;</button>
      </div>
      <form id="reviewForm">
        <input type="hidden" id="review-id">
        <input type="hidden" id="review-artisan-id">
        <p class="muted mb-2" id="reviewTargetLabel"></p>
        <div class="form-group">
          <label>Rating</label>
          <select id="review-rating" required>
            <option value="5">⭐⭐⭐⭐⭐ Excellent (5)</option>
            <option value="4">⭐⭐⭐⭐ Good (4)</option>
            <option value="3">⭐⭐⭐ Average (3)</option>
            <option value="2">⭐⭐ Poor (2)</option>
            <option value="1">⭐ Very Poor (1)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Your Feedback</label>
          <textarea id="review-comment" rows="3" placeholder="Share your experience..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="saveReviewBtn">Submit Review</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
