<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Heritage - Tourism & Cultural Guide</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <i data-lucide="compass" class="brand-icon"></i>
        <h1>Local Heritage</h1>
        <p class="tagline">Discover Local Artisans & Tourism</p>
      </div>

      <!-- Login Section -->
      <div id="loginSection" class="auth-section">
        <form id="loginForm">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">Login</button>
        </form>
        <div class="switch-auth">
          <span>Don't have an account?</span>
          <button type="button" id="goToRegisterBtn" class="btn-link">Register</button>
        </div>
      </div>

      <!-- Register Section -->
      <div id="registerSection" class="auth-section hidden">
        <form id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label for="register-first-name">First Name</label>
              <input type="text" id="register-first-name" required>
            </div>
            <div class="form-group">
              <label for="register-last-name">Last Name</label>
              <input type="text" id="register-last-name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="register-phone">Phone Number</label>
            <input type="tel" id="register-phone" placeholder="07XXXXXXXX">
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" required placeholder="Minimum 6 characters">
          </div>
          <div class="form-group">
            <label for="register-role">I am registering as:</label>
            <select id="register-role" required>
              <option value="">Select role...</option>
              <option value="customer">Customer / Traveler</option>
              <option value="artisan">Artisan / Site Host</option>
            </select>
          </div>
          <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
        </form>
        <div class="switch-auth">
          <span>Already have an account?</span>
          <button type="button" id="goToLoginBtn" class="btn-link">Back to Login</button>
        </div>
      </div>

      <div id="authMessage" class="message"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
