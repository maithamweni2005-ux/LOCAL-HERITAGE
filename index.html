<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Heritage - Tourism Guide</title>
    <link rel="stylesheet" href="styles.css">
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Local Heritage</h1>
            <p class="tagline">Discover Local Artisans & Tourism</p>

            <!-- Login Form -->
            <div id="loginSection" class="auth-section">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <div class="switch-auth">
                    <p>Don't have an account?</p>
                    <button type="button" id="goToRegisterBtn" class="btn-link">Register</button>
                </div>
            </div>

            <!-- Register Form (hidden by default) -->
            <div id="registerSection" class="auth-section hidden">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-first-name">First Name</label>
                            <input type="text" id="register-first-name" required>
                        </div>
                        <div class="form-group">
                            <label for="register-last-name">Last Name</label>
                            <input type="text" id="register-last-name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-phone">Phone Number</label>
                        <input type="tel" id="register-phone">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-role">I am a:</label>
                        <select id="register-role" required>
                            <option value="">Select...</option>
                            <option value="customer">Customer</option>
                            <option value="artisan">Artisan</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
                <div class="switch-auth">
                    <p>Already have an account?</p>
                    <button type="button" id="goToLoginBtn" class="btn-link">Back to Login</button>
                </div>
            </div>

            <div id="authMessage" class="message"></div>
        </div>
    </div>

   
    <script src="app.js"></script>
</body>
</html>
